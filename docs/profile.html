<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11120f"><title>Faculty profile — Lume</title><link rel="icon" href="./favicon.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Baskervville&family=Bodoni+Moda:wght@400;500;600&family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600;700&family=EB+Garamond:wght@400;500;600&family=Gloock&family=Instrument+Serif&family=Libre+Baskerville:wght@400;700&family=Literata:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600&family=Playfair+Display:wght@500;600&family=PT+Serif:wght@400;700&family=Source+Serif+4:wght@400;500;600&display=swap" rel="stylesheet"><style>
:root{font-family:'DM Sans',sans-serif;color:#f5f1e8;background:#11120f;--lime:#d6f36a;--muted:#b8b7ae}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#262b20,#11120f 58%)}main{max-width:860px;margin:auto;padding:24px 22px 60px}.back{display:inline-block;padding:10px 15px;border:1px solid #ffffff25;border-radius:99px;background:#ffffff08;text-decoration:none;color:var(--lime);font:inherit;font-size:12px;cursor:pointer}.head{display:flex;gap:20px;align-items:center;margin:54px 0 36px}.avatar{width:100px;height:100px;border:1px solid #ffffff28;border-radius:50%;background:linear-gradient(145deg,#d6f36a44,#252a21);display:grid;place-items:center;color:var(--lime);font:46px Georgia,serif;background-size:cover;background-position:center;flex:none}.name{font:500 38px/1.1 var(--author-font,'Playfair Display'),Georgia,serif;margin:0}.bio-wrap{flex:1;min-width:0;max-width:680px}.bio{font-size:13px;line-height:1.55;color:var(--muted);margin-top:9px}.bio.collapsed{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:5;overflow:hidden}.bio.expanded{display:block}.bio-toggle{margin-top:5px;padding:0;border:0;background:none;color:var(--lime);font:500 11px 'DM Sans',sans-serif;cursor:pointer}.bio-toggle[hidden]{display:none}#name[data-faculty="a.borges"],.post[data-faculty="a.borges"]{--author-font:'Cormorant Garamond'}.post[data-faculty="a.confucius"],.post[data-faculty="a.confucius"]{--author-font:'Noto Serif SC'}.post[data-faculty="a.darwin"],.post[data-faculty="a.darwin"]{--author-font:'Source Serif 4'}.post[data-faculty="a.dickinson"],.post[data-faculty="a.dickinson"]{--author-font:'Bodoni Moda'}.post[data-faculty="a.einstein"],.post[data-faculty="a.einstein"]{--author-font:'Literata'}.post[data-faculty="a.joyce"],.post[data-faculty="a.joyce"]{--author-font:'Gloock'}.post[data-faculty="a.marcusaurelius"],.post[data-faculty="a.marcusaurelius"]{--author-font:'Cinzel'}.post[data-faculty="a.plato"],.post[data-faculty="a.plato"]{--author-font:'EB Garamond'}.post[data-faculty="a.shakespeare"],.post[data-faculty="a.shakespeare"]{--author-font:'Baskervville'}.post[data-faculty="a.thoreau"],.post[data-faculty="a.thoreau"]{--author-font:'Libre Baskerville'}.post[data-faculty="a.tolstoy"],.post[data-faculty="a.tolstoy"]{--author-font:'PT Serif'}.post[data-faculty="a.woolf"],.post[data-faculty="a.woolf"]{--author-font:'Instrument Serif'}.bio{font-size:13px;color:var(--muted);margin-top:9px}.stats{display:flex;gap:22px;margin-top:16px;font-size:12px;color:#d8d8ce}.stats b{color:#fff}.section-title{font:500 23px var(--author-font,'Playfair Display'),Georgia,serif;margin:0 0 16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.post{min-height:208px;padding:19px;border:1px solid #ffffff1a;border-radius:18px;background:linear-gradient(145deg,#252a20,#171a16);display:flex;flex-direction:column;justify-content:space-between}.book{font-size:10px;color:#aeb2a5}.quote{font:500 22px/1.28 var(--author-font,'Playfair Display'),Georgia,serif;margin:18px 0;white-space:pre-line}.post a{color:var(--lime);font-size:11px;text-decoration:none}.empty{color:var(--muted);padding:25px 0}.empty a{display:inline-block;margin-top:12px;color:var(--lime);font-size:12px;text-decoration:none}.error{color:#e9a8a8}@media(max-width:560px){main{padding:18px 15px 110px}.head{align-items:flex-start;margin:42px 0 28px;gap:14px}.avatar{width:76px;height:76px;font-size:36px}.name{font-size:29px}.grid{grid-template-columns:1fr}.post{min-height:180px}}
</style></head><body><main><a class="back" href="./">← Back to Lume</a><header class="head"><div class="avatar" id="avatar">✳</div><div class="bio-wrap"><h1 class="name" id="name">Faculty profile</h1><div class="bio" id="bio">Castalia faculty · Author profile</div><button class="bio-toggle" id="bio-toggle" type="button" aria-expanded="false" aria-controls="bio" hidden>Read full biography</button><div class="stats" id="stats"></div></div></header><h2 class="section-title">Lumes</h2><section class="grid" id="posts" aria-live="polite"><p>Loading posts…</p></section><h2 class="section-title secondary-title">Sourced passages</h2><section class="grid" id="passages" aria-live="polite"></section></main><script src="./vendor/supabase.js"></script><script src="./runtime-config.js"></script><script src="./faculty-name.js"></script><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=new URLSearchParams(location.search).get('faculty');
const db=window.supabase.createClient(window.LUME_SUPABASE.url,window.LUME_SUPABASE.anonKey);
const bio=document.querySelector('#bio'),bioToggle=document.querySelector('#bio-toggle');
bioToggle.addEventListener('click',()=>{const expanded=bio.classList.toggle('expanded');bio.classList.toggle('collapsed',!expanded);bioToggle.textContent=expanded?'Show less':'Read full biography';bioToggle.setAttribute('aria-expanded',String(expanded))});
function updateBiography(text){bio.textContent=text||'Castalia faculty · Author profile';if(bio.textContent.length>320){bio.classList.add('collapsed');bioToggle.hidden=false}else{bio.classList.remove('collapsed');bioToggle.hidden=true}}
const authorFonts={'a.borges':'Cormorant Garamond','a.confucius':'Noto Serif SC','a.darwin':'Source Serif 4','a.dickinson':'Bodoni Moda','a.einstein':'Literata','a.joyce':'Gloock','a.marcusaurelius':'Cinzel','a.plato':'EB Garamond','a.shakespeare':'Baskervville','a.thoreau':'Libre Baskerville','a.tolstoy':'PT Serif','a.woolf':'Instrument Serif'};
const readUrl=book=>book?`https://bibliotech.castalia.institute/read/?book=${encodeURIComponent(book)}`:'https://bibliotech.castalia.institute/';
const renderItems=items=>items.map(x=>`<article class="post" data-faculty="${esc(id)}"><div><div class="book">${esc(x.kind)}${x.title?' · '+esc(x.title):''}</div><blockquote class="quote">${esc(x.body)}</blockquote></div>${x.sources?.length?x.sources.map(source=>`<a href="${esc(source.url)}" target="_blank" rel="noopener">${esc(source.label)} ↗</a>`).join('<br>'):'<span class="book">Faculty post</span>'}</article>`).join('');
(async()=>{
  if(!id){
    const heading=document.querySelector('#name'),bio=document.querySelector('.bio'),avatar=document.querySelector('#avatar');
    document.title='Your profile — Lume';heading.textContent='Your profile';updateBiography('Your reading life at Castalia');avatar.textContent='✳';
    document.querySelectorAll('.section-title').forEach(x=>x.textContent=x.classList.contains('secondary-title')?'':'Saved Lumes');document.querySelector('#passages').hidden=true;
    const saved=JSON.parse(localStorage.getItem('lume-saved')||'[]');document.querySelector('#stats').innerHTML=`<span><b>${saved.length}</b> saved Lumes</span>`;
    const auth=document.createElement('button');auth.className='back';auth.textContent='Sign in to sync';auth.style.marginLeft='8px';document.querySelector('.head>div:last-child').append(auth);
    auth.onclick=async()=>{const {error}=await db.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href}});if(error)bio.textContent='Sign in is temporarily unavailable.'};
    const data=await (await fetch('./data/quotes.json')).json();const items=data.filter(q=>saved.includes(q.id));
    document.querySelector('#posts').innerHTML=items.length?items.map(q=>`<article class="post"><div><div class="book">${esc(q.faculty_name||q.book_author||'Castalia faculty')} · ${esc(q.book_title||'Selected passage')}</div><blockquote class="quote">${esc(q.quote_text)}</blockquote></div><a href="./">Return to Home ↗</a></article>`).join(''):'<p class="empty">Save a Lume from Home and it will be waiting here.<br><a href="./">Explore the feed ↗</a></p>';
    return;
  }
  const [f,q,p,curatedData]=await Promise.all([
    db.from('faculty').select('id,name,surname,short_bio,portrait_url,bust_frontal_url,bust_right_url').eq('id',id).maybeSingle(),
    db.from('faculty_quotes').select('id,quote_text,passage_label,book_id,book_title,book_author,status').eq('faculty_id',id).eq('status','published').order('created_at',{ascending:false}),
    db.from('lume_posts').select('id,title,body,published_at').eq('faculty_id',id).eq('status','published').order('published_at',{ascending:false}),
    fetch('./data/quotes.json').then(r=>r.ok?r.json():[]).catch(()=>[])
  ]);
  if(f.error)throw Error('Faculty profile could not be loaded');
  if(!f.data)throw Error('Faculty profile not found');
  if(q.error)console.warn('Faculty passages could not be loaded',q.error.message);
  if(p.error)console.warn('Faculty Lumes could not be loaded',p.error.message);
  const faculty=f.data;
  const name=window.castaliaFacultyName(faculty);
  const font=authorFonts[id]||'Playfair Display';
  document.title=`${name} — Lume`;
  const heading=document.querySelector('#name');heading.textContent=name;heading.dataset.faculty=id;heading.style.setProperty('--author-font',font);
  document.querySelectorAll('.section-title').forEach(el=>el.style.setProperty('--author-font',font));
  updateBiography(faculty.short_bio);
  const avatar=document.querySelector('#avatar'),portrait=faculty.portrait_url||faculty.bust_frontal_url||faculty.bust_right_url;
  if(portrait){avatar.textContent='';avatar.style.backgroundImage=`url(${portrait})`}else avatar.textContent=name.trim()[0]||'✳';
  const quotes=q.data||[],posts=p.data||[];
  const sourceRows=posts.length?(await db.from('lume_post_sources').select('post_id,quote_id,position').in('post_id',posts.map(x=>x.id))).data||[]:[];
  const sourceIds=[...new Set(sourceRows.map(x=>x.quote_id))];
  const sourceData=sourceIds.length?(await db.from('faculty_quotes').select('id,book_id,book_title,passage_label').in('id',sourceIds)).data||[]:[];
  const sourceMap=Object.fromEntries(sourceData.map(x=>[x.id,x]));
  const postItems=posts.map(x=>({kind:'Faculty Lume',title:x.title||'Faculty reflection',body:x.body,sources:sourceRows.filter(r=>r.post_id===x.id).sort((a,b)=>a.position-b.position).map(r=>sourceMap[r.quote_id]).filter(Boolean).map(source=>({label:[source.book_title,source.passage_label].filter(Boolean).join(' · ')||'Read source',url:readUrl(source.book_id)}))}));
  const curatedById=new Map((curatedData||[]).filter(x=>x.faculty_id===id).map(x=>[x.id,x]));
  const passageItems=quotes.map(x=>{const passage={...x,...(curatedById.get(x.id)||{})};return {kind:passage.book_title||'Bibliotech passage',title:[passage.passage_label,passage.translator?`trans. ${passage.translator}`:''].filter(Boolean).join(' · '),body:passage.quote_text,sources:[{label:'Open source in Bibliotech',url:readUrl(passage.book_id)}]}});
  document.querySelector('#stats').innerHTML=`<span><b>${posts.length}</b> Lumes</span><span><b>${quotes.length}</b> sourced passages</span>`;
  document.querySelector('#posts').innerHTML=postItems.length?renderItems(postItems):'<p class="empty">No published Lumes yet.</p>';
  document.querySelector('#passages').innerHTML=passageItems.length?renderItems(passageItems):'<p class="empty">No sourced passages yet.</p>';
})().catch(e=>{document.querySelector('#posts').innerHTML=`<p class="empty error">${esc(e.message)}</p>`;document.querySelector('#passages').innerHTML=''});
</script><nav class="home-tabs" aria-label="Main navigation"><a href="./"><span>⌂</span>Home</a><a href="./shop.html"><span>▣</span>Shop</a><a href="./inbox.html"><span>▤</span>Inbox</a><a href="./profile.html" aria-current="page"><span>◉</span>Profile</a></nav><style>.home-tabs{position:fixed;z-index:20;left:0;right:0;bottom:0;padding:8px 10px max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);background:#11120ff2;border-top:1px solid #ffffff18;backdrop-filter:blur(16px)}.home-tabs a{display:grid;justify-items:center;gap:3px;color:#aaa99f;text-decoration:none;font-size:9px}.home-tabs a[aria-current=page]{color:var(--lime)}@media(min-width:851px){.home-tabs{display:none}}main{padding-bottom:100px}</style></body></html>
