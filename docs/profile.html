<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11120f"><title>Faculty profile — Lume</title><link rel="icon" href="./favicon.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"><style>
:root{font-family:'DM Sans',sans-serif;color:#f5f1e8;background:#11120f;--lime:#d6f36a;--muted:#b8b7ae}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#262b20,#11120f 58%)}main{max-width:860px;margin:auto;padding:24px 22px 60px}.back{display:inline-block;padding:10px 15px;border:1px solid #ffffff25;border-radius:99px;text-decoration:none;color:var(--lime);font-size:12px}.head{display:flex;gap:20px;align-items:center;margin:54px 0 36px}.avatar{width:100px;height:100px;border:1px solid #ffffff28;border-radius:50%;background:linear-gradient(145deg,#d6f36a44,#252a21);display:grid;place-items:center;color:var(--lime);font:46px Georgia,serif;background-size:200% 200%;background-position:center}.name{font:500 38px/1.1 'Playfair Display',Georgia,serif;margin:0}.bio{font-size:13px;color:var(--muted);margin-top:9px}.stats{display:flex;gap:22px;margin-top:16px;font-size:12px;color:#d8d8ce}.stats b{color:#fff}.section-title{font:500 23px 'Playfair Display',Georgia,serif;margin:0 0 16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.post{min-height:208px;padding:19px;border:1px solid #ffffff1a;border-radius:18px;background:linear-gradient(145deg,#252a20,#171a16);display:flex;flex-direction:column;justify-content:space-between}.book{font-size:10px;color:#aeb2a5}.quote{font:500 22px/1.28 'Playfair Display',Georgia,serif;margin:18px 0}.post a{color:var(--lime);font-size:11px;text-decoration:none}.empty{color:var(--muted);padding:25px 0}.error{color:#e9a8a8}@media(max-width:560px){main{padding:18px 15px 40px}.head{margin:42px 0 28px;gap:14px}.avatar{width:76px;height:76px;font-size:36px}.name{font-size:29px}.grid{grid-template-columns:1fr}.post{min-height:180px}}
</style></head><body><main><a class="back" href="./">← Back to Lume</a><header class="head"><div class="avatar" id="avatar">✳</div><div><h1 class="name" id="name">Faculty profile</h1><div class="bio">Castalia faculty · Author profile</div><div class="stats" id="stats"></div></div></header><h2 class="section-title">Lumes</h2><section class="grid" id="posts" aria-live="polite"><p>Loading posts…</p></section></main><script src="./vendor/supabase.js"></script><script src="./runtime-config.js"></script><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=new URLSearchParams(location.search).get('faculty');const db=window.supabase.createClient(window.LUME_SUPABASE.url,window.LUME_SUPABASE.anonKey);const readUrl=(book)=>book?`https://bibliotech.castalia.institute/read/?book=${encodeURIComponent(book)}`:'https://bibliotech.castalia.institute/';(async()=>{if(!id)throw Error('Faculty profile not found');const [f,q,p]=await Promise.all([db.from('faculty').select('id,name,surname,short_bio,portrait_url,bust_frontal_url,bust_right_url').eq('id',id).maybeSingle(),db.from('faculty_quotes').select('id,quote_text,passage_label,book_id,book_title,book_author,status').eq('faculty_id',id).eq('status','published').order('created_at',{ascending:false}),db.from('lume_posts').select('id,title,body,published_at').eq('faculty_id',id).eq('status','published').order('published_at',{ascending:false})]);if(f.error)throw Error('Faculty profile could not be loaded');if(!f.data)throw Error('Faculty profile not found');if(q.error)console.warn('Faculty quotes could not be loaded',q.error.message);if(p.error)console.warn('Faculty Lumes could not be loaded',p.error.message);const faculty=f.data,baseName=(faculty.name||'').trim(),surname=(faculty.surname||'').trim(),name=baseName.toLocaleLowerCase().endsWith(surname.toLocaleLowerCase())?baseName:[baseName,surname].filter(Boolean).join(' ').trim();document.title=`${name} — Lume`;document.querySelector('#name').textContent=name;document.querySelector('.bio').textContent=faculty.short_bio||'Castalia faculty · Lume author profile';const avatar=document.querySelector('#avatar'),portrait=faculty.portrait_url||faculty.bust_frontal_url||faculty.bust_right_url;if(portrait){avatar.textContent='';avatar.style.backgroundImage=`url(${portrait})`}else avatar.textContent=name.trim()[0]||'✳';const quotes=q.data||[],posts=p.data||[],sourceRows=posts.length?(await db.from('lume_post_sources').select('post_id,quote_id,position').in('post_id',posts.map(x=>x.id))).data||[]:[],sourceIds=[...new Set(sourceRows.map(x=>x.quote_id))],sourceData=sourceIds.length?(await db.from('faculty_quotes').select('id,book_id,book_title,passage_label').in('id',sourceIds)).data||[]:[],sourceMap=Object.fromEntries(sourceData.map(x=>[x.id,x])),items=[...posts.map(x=>({kind:'Faculty Lume',title:x.title||'Faculty reflection',body:x.body,sources:sourceRows.filter(r=>r.post_id===x.id).sort((a,b)=>a.position-b.position).map(r=>sourceMap[r.quote_id]).filter(Boolean).map(q=>({label:[q.book_title,q.passage_label].filter(Boolean).join(' · ')||'Read source',url:readUrl(q.book_id)}))})),...quotes.map(x=>({kind:x.book_title||'Bibliotech passage',title:x.passage_label||x.book_author||'',body:x.quote_text,sources:[{label:'Open source in Bibliotech',url:readUrl(x.book_id)}]}))];document.querySelector('#stats').innerHTML=`<span><b>${items.length}</b> Lumes</span><span><b>${quotes.length}</b> sourced passages</span>`;document.querySelector('#posts').innerHTML=items.length?items.map(x=>`<article class="post"><div><div class="book">${esc(x.kind)}${x.title?' · '+esc(x.title):''}</div><blockquote class="quote">${esc(x.body)}</blockquote></div>${x.sources?.length?x.sources.map(source=>`<a href="${esc(source.url)}" target="_blank" rel="noopener">${esc(source.label)} ↗</a>`).join('<br>'):'<span class="book">Faculty post</span>'}</article>`).join(''):'<p class="empty">No published Lumes yet. Sourced passages will appear here when added.</p>'})().catch(e=>{document.querySelector('#posts').innerHTML=`<p class="empty error">${esc(e.message)}</p>`});</script></body></html>
