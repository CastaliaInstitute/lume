<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11120f"><title>Inbox — Lume</title><style>
:root{font:16px/1.5 'DM Sans',system-ui,sans-serif;color:#f5f1e8;background:#11120f;--lime:#d6f36a}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#262b20,#11120f 58%)}main{max-width:620px;margin:auto;padding:30px 22px 100px}a{color:inherit}.back{color:var(--lime);font-size:13px;text-decoration:none}.eyebrow{margin:48px 0 4px;color:var(--lime);font-size:10px;letter-spacing:.16em;text-transform:uppercase}h1{font:500 38px/1.1 Georgia,serif;margin:0}.empty{margin-top:28px;padding:24px;border:1px solid #ffffff18;border-radius:18px;background:#ffffff06;color:#b8b7ae;font-size:14px}.threads{display:grid;gap:10px;margin-top:18px}.thread{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:15px 16px;border:1px solid #ffffff1b;border-radius:16px;background:#ffffff07;text-decoration:none}.thread small{display:block;color:#a9ad9c;font-size:10px;letter-spacing:.08em;text-transform:uppercase}.thread strong{display:block;font:500 18px Georgia,serif;margin-top:3px}.thread span:last-child{color:var(--lime);font-size:12px}.signin{display:none;margin-top:18px;padding:16px;border:1px solid #ffffff18;border-radius:16px;background:#ffffff07;color:#c5c6bc;font-size:13px}.signin button{display:block;margin-top:12px;padding:9px 14px;border:1px solid #d6f36a66;border-radius:99px;background:#d6f36a12;color:var(--lime);font:inherit;cursor:pointer}.matrix-link{display:inline-block;margin-top:16px;padding:10px 14px;border:1px solid #d6f36a66;border-radius:99px;background:#d6f36a12;color:var(--lime);text-decoration:none;font-size:12px}.tabs{position:fixed;z-index:5;left:0;right:0;bottom:0;padding:8px 10px max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);background:#11120ff2;border-top:1px solid #ffffff18;backdrop-filter:blur(16px)}.tabs a{display:grid;justify-items:center;gap:3px;color:#aaa99f;text-decoration:none;font-size:9px}.tabs a[aria-current=page]{color:var(--lime)}.tabs svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
</style></head><body><main><a class="back" href="./">← Home</a><p class="eyebrow">Your Castalia connections</p><h1>Inbox</h1><section class="empty" id="thread-empty">Threads you open from Lume posts will collect here. Each room is created the first time someone starts a discussion.</section><section class="threads" id="threads" aria-live="polite"></section><section class="signin" id="signin-panel">Sign in to see and keep the Lume rooms you open together here.<button id="signin-button" type="button">Sign in with Google</button></section><a class="matrix-link" href="https://element.castalia.institute" target="_blank" rel="noopener">Open Castalia Matrix ↗</a></main><nav class="tabs" aria-label="Main navigation"><a href="./"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></a><a href="./shop.html"><svg viewBox="0 0 24 24"><path d="M3 8h18l-2 12H5L3 8Z"/><path d="M8 8a4 4 0 0 1 8 0M12 12v4m-2-2h4"/></svg><span>Shop</span></a><a href="./inbox.html" aria-current="page"><svg viewBox="0 0 24 24"><path d="M4 5h16v12h-5l-3 3-3-3H4z"/><path d="M8 9h8M8 12h6"/></svg><span>Inbox</span></a><a href="./profile.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Profile</span></a></nav><script src="./vendor/supabase.js"></script><script src="./runtime-config.js"></script><script src="./faculty-name.js"></script><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const db=window.supabase.createClient(window.LUME_SUPABASE.url,window.LUME_SUPABASE.anonKey);
const roomUrl=id=>`https://element.castalia.institute/#/room/${encodeURIComponent(id)}`;
const empty=document.querySelector('#thread-empty');
const signInPanel=document.querySelector('#signin-panel');
function showSignIn(){empty.hidden=true;signInPanel.style.display='block'}
async function loadInbox(){
  signInPanel.style.display='none';
  empty.hidden=false;
  const {data:sessionData}=await db.auth.getSession();
  const user=sessionData?.session?.user;
  if(!user){showSignIn();return}
  const {data:members,error:memberError}=await db.from('lume_discussion_members').select('discussion_id,last_opened_at').eq('member_id',user.id).order('last_opened_at',{ascending:false}).limit(100);
  if(memberError){empty.textContent='Your Lume rooms will appear here once threaded discussions are enabled.';return}
  if(!members?.length){empty.textContent='Rooms you open from Lume posts will collect here. Each post gets one room when its first reader starts a discussion.';return}
  const {data:rooms,error}=await db.from('lume_discussion_rooms').select('id,content_type,content_id,matrix_room_id,created_at').in('id',members.map(x=>x.discussion_id));
  if(error){empty.textContent='Your Lume rooms could not load just now.';return}
  const ids=type=>rooms.filter(x=>x.content_type===type).map(x=>x.content_id);
  const [p,q]=await Promise.all([ids('post').length?db.from('lume_posts').select('id,title,body,faculty_id').in('id',ids('post')):Promise.resolve({data:[]}),ids('quote').length?db.from('faculty_quotes').select('id,book_title,passage_label,faculty_id').in('id',ids('quote')):Promise.resolve({data:[]})]);
  const content=new Map([...(p.data||[]).map(x=>[x.id,{...x,type:'post'}]),...(q.data||[]).map(x=>[x.id,{...x,type:'quote'}])]);
  const facultyIds=[...new Set([...content.values()].map(x=>x.faculty_id).filter(Boolean))];
  const {data:faculty}=facultyIds.length?await db.from('faculty').select('id,name,surname').in('id',facultyIds):{data:[]};
  const authors=new Map((faculty||[]).map(x=>[x.id,window.castaliaFacultyName(x)]));
  const byRoom=new Map(members.map(x=>[x.discussion_id,x.last_opened_at]));
  rooms.sort((a,b)=>Date.parse(byRoom.get(b.id))-Date.parse(byRoom.get(a.id)));
  empty.hidden=true;
  document.querySelector('#threads').innerHTML=rooms.map(room=>{const item=content.get(room.content_id)||{};const title=item.type==='post'?item.title||String(item.body||'Faculty Lume').slice(0,55):[item.book_title,item.passage_label].filter(Boolean).join(' · ')||'Sourced passage';return `<a class="thread" href="${esc(roomUrl(room.matrix_room_id))}" target="_blank" rel="noopener"><span><small>${esc(authors.get(item.faculty_id)||'Castalia faculty')} · ${room.content_type==='post'?'Lume':'Passage'}</small><strong>${esc(title)}</strong></span><span>Open ↗</span></a>`}).join('');
}
document.querySelector('#signin-button').addEventListener('click',async()=>{const {error}=await db.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+'/inbox.html'}});if(error)empty.textContent='Could not open sign-in. Please try again.'});
loadInbox().catch(()=>{empty.textContent='Your Lume rooms could not load just now.'});
</script></body></html>
