<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11120f"><title>Castalia Faculty — Lume</title><link rel="icon" href="./favicon.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"><style>:root{font-family:'DM Sans',sans-serif;color:#f5f1e8;background:#11120f;--lime:#d6f36a;--muted:#b8b7ae}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#262b20,#11120f 58%)}main{max-width:940px;margin:auto;padding:24px 22px 60px}.back{display:inline-block;padding:10px 15px;border:1px solid #ffffff25;border-radius:99px;text-decoration:none;color:var(--lime);font-size:12px}.head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin:50px 0 24px}.title{font:500 38px 'Playfair Display',Georgia,serif;margin:0}.sub{color:var(--muted);font-size:12px;margin-top:7px}.search{width:min(360px,100%);border:1px solid #ffffff25;border-radius:14px;background:#ffffff09;color:#f5f1e8;padding:12px;font:13px 'DM Sans',sans-serif}.list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.person{min-height:92px;display:flex;align-items:center;gap:12px;padding:13px;border:1px solid #ffffff1a;border-radius:14px;background:#ffffff06;text-decoration:none;color:#f5f1e8}.person:hover{border-color:#d6f36a66;background:#d6f36a0b}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#d6f36a19;color:var(--lime);font:20px Georgia,serif;flex:none}.name{font-size:13px;font-weight:600}.count{font-size:10px;color:var(--muted);margin-top:4px}.status{font-size:12px;color:var(--muted);margin:14px 0}@media(max-width:680px){main{padding:18px 14px 40px}.head{display:block;margin:38px 0 20px}.title{font-size:32px}.search{margin-top:18px}.list{grid-template-columns:repeat(2,minmax(0,1fr))}.person{padding:10px;gap:8px;min-height:80px}.name{font-size:12px}}@media(max-width:380px){.list{grid-template-columns:1fr}}</style></head><body><main><a class="back" href="./">← Back to Lume</a><header class="head"><div><h1 class="title">Castalia faculty</h1><div class="sub" id="total">Finding faculty profiles…</div></div><input class="search" id="search" type="search" placeholder="Find a faculty member" aria-label="Search faculty"></header><p class="status" id="status" role="status" aria-live="polite"></p><section class="list" id="list"></section><button class="back" id="more" hidden style="margin:20px 0;cursor:pointer;background:#ffffff08">Load more faculty</button></main><script src="./vendor/supabase.js"></script><script src="./runtime-config.js"></script><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const list=document.querySelector('#list'),search=document.querySelector('#search'),status=document.querySelector('#status'),more=document.querySelector('#more');const db=window.supabase.createClient(window.LUME_SUPABASE.url,window.LUME_SUPABASE.anonKey);let people=[],offset=0,loading=false,searchTimer;function draw(){const term=search.value.trim();document.querySelector('#total').textContent=term?`${people.length.toLocaleString()} matching faculty profiles`:`Castalia’s faculty directory`;list.innerHTML=people.map(x=>`<a class="person" href="profile.html?faculty=${encodeURIComponent(x.id)}"><span class="avatar">${esc(x.full.trim()[0]||'✳')}</span><span><span class="name">${esc(x.full)}</span><span class="count">View Lume profile →</span></span></a>`).join('');more.hidden=Boolean(term)||people.length<offset||people.length===0;status.textContent=people.length?'':'No faculty match that name.'}async function loadRanked(reset=false){if(loading)return;loading=true;if(reset){offset=0;people=[]}status.textContent='Loading ranked faculty…';try{const {data,error}=await db.from('faculty').select('id,name,surname,rank').order('rank',{ascending:false,nullsFirst:false}).order('id').range(offset,offset+59);if(error)throw error;people.push(...(data||[]).map(x=>({id:x.id,full:(x.name||'').trim().toLocaleLowerCase().endsWith((x.surname||'').trim().toLocaleLowerCase())?(x.name||'').trim():[x.name,x.surname].filter(Boolean).join(' ').trim(),rank:x.rank})));offset+=data?.length||0;draw()}catch(e){status.textContent='Faculty directory is temporarily unavailable.';console.error('Faculty directory could not load',e.message)}finally{loading=false}}async function searchFaculty(term){people=[];if(!term){await loadRanked(true);return}status.textContent='Searching faculty…';try{const pattern=`%${term.replace(/[%,()]/g,' ').trim()}%`;const [a,b]=await Promise.all([db.from('faculty').select('id,name,surname,rank').ilike('name',pattern).order('rank',{ascending:false,nullsFirst:false}).limit(100),db.from('faculty').select('id,name,surname,rank').ilike('surname',pattern).order('rank',{ascending:false,nullsFirst:false}).limit(100)]);if(a.error)throw a.error;if(b.error)throw b.error;const map=new Map();for(const x of [...(a.data||[]),...(b.data||[])])map.set(x.id,{id:x.id,full:(x.name||'').trim().toLocaleLowerCase().endsWith((x.surname||'').trim().toLocaleLowerCase())?(x.name||'').trim():[x.name,x.surname].filter(Boolean).join(' ').trim(),rank:x.rank});people=[...map.values()].sort((x,y)=>(y.rank||0)-(x.rank||0)||x.full.localeCompare(y.full));draw()}catch(e){status.textContent='Faculty search is temporarily unavailable.';console.error('Faculty search failed',e.message)}}search.addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>searchFaculty(search.value.trim()),220)});more.addEventListener('click',()=>loadRanked());loadRanked(true);</script></body></html>
