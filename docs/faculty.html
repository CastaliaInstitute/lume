<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11120f"><title>Castalia Faculty — Lume</title><link rel="icon" href="./favicon.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"><style>:root{font-family:'DM Sans',sans-serif;color:#f5f1e8;background:#11120f;--lime:#d6f36a;--muted:#b8b7ae}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#262b20,#11120f 58%)}main{max-width:940px;margin:auto;padding:24px 22px 60px}.back{display:inline-block;padding:10px 15px;border:1px solid #ffffff25;border-radius:99px;text-decoration:none;color:var(--lime);font-size:12px}.head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin:50px 0 24px}#more[hidden]{display:none}.title{font:500 38px 'Playfair Display',Georgia,serif;margin:0}.sub{color:var(--muted);font-size:12px;margin-top:7px}.search{width:min(360px,100%);border:1px solid #ffffff25;border-radius:14px;background:#ffffff09;color:#f5f1e8;padding:12px;font:13px 'DM Sans',sans-serif}.list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.person{min-height:92px;display:flex;align-items:center;gap:12px;padding:13px;border:1px solid #ffffff1a;border-radius:14px;background:#ffffff06;text-decoration:none;color:#f5f1e8}.person:hover{border-color:#d6f36a66;background:#d6f36a0b}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#d6f36a19;color:var(--lime);font:20px Georgia,serif;flex:none}.name{display:block;font-size:13px;font-weight:600;overflow-wrap:anywhere}.count{display:block;font-size:10px;color:var(--muted);margin-top:4px}.status{font-size:12px;color:var(--muted);margin:14px 0}.tabs{position:fixed;z-index:20;left:0;right:0;bottom:0;padding:8px 10px max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);background:#11120ff2;border-top:1px solid #ffffff18;backdrop-filter:blur(16px)}.tabs a{display:grid;justify-items:center;gap:3px;color:#aaa99f;text-decoration:none;font-size:9px}.tabs svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.list.search-results{grid-template-columns:1fr}.list.search-results .person{min-height:72px}@media(max-width:680px){main{padding:18px 14px 110px}.head{display:block;margin:38px 0 20px}.title{font-size:32px}.search{margin-top:18px}.list{grid-template-columns:repeat(2,minmax(0,1fr))}.person{padding:10px;gap:8px;min-height:80px}.name{font-size:12px}}@media(max-width:380px){.list{grid-template-columns:1fr}}@media(min-width:851px){.tabs{display:none}}</style></head><body><main><a class="back" href="./">← Back to Lume</a><header class="head"><div><h1 class="title">Castalia faculty</h1><div class="sub" id="total">Finding faculty profiles…</div></div><input class="search" id="search" type="search" placeholder="Find a faculty member" aria-label="Search faculty"></header><p class="status" id="status" role="status" aria-live="polite"></p><section class="list" id="list"></section><button class="back" id="more" hidden style="margin:20px 0;cursor:pointer;background:#ffffff08">Load more faculty</button></main><nav class="tabs" aria-label="Main navigation"><a href="./"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></a><a href="./shop.html"><svg viewBox="0 0 24 24"><path d="M3 8h18l-2 12H5L3 8Z"/><path d="M8 8a4 4 0 0 1 8 0M12 12v4m-2-2h4"/></svg><span>Shop</span></a><a href="./inbox.html"><svg viewBox="0 0 24 24"><path d="M4 5h16v12h-5l-3 3-3-3H4z"/><path d="M8 9h8M8 12h6"/></svg><span>Inbox</span></a><a href="./profile.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Profile</span></a></nav><script src="./vendor/supabase.js"></script><script src="./runtime-config.js"></script><script src="./faculty-name.js"></script><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const list=document.querySelector('#list'),search=document.querySelector('#search'),status=document.querySelector('#status'),more=document.querySelector('#more');
const db=window.supabase.createClient(window.LUME_SUPABASE.url,window.LUME_SUPABASE.anonKey);
let people=[],offset=0,searchOffset=0,loading=false,hasMore=true,searchTimer,searchVersion=0;
function nameKey(name){return name.normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}
function rankWeight(rank){return ({seated:3,professor:2,adjunct:1})[String(rank||'').toLocaleLowerCase()]||Number(rank)||0}
function uniqueFaculty(items){const byName=new Map();for(const person of items){const key=nameKey(person.full);const current=byName.get(key);const priority=rankWeight(person.rank),currentPriority=rankWeight(current?.rank);const numericId=/\d+$/.test(person.id),currentNumeric=/\d+$/.test(current?.id||'');if(!current||priority>currentPriority||(priority===currentPriority&&currentNumeric&&!numericId))byName.set(key,person)}return [...byName.values()].sort((a,b)=>rankWeight(b.rank)-rankWeight(a.rank)||a.full.localeCompare(b.full))}
function draw(){const term=search.value.trim(),visible=uniqueFaculty(people);list.classList.toggle('search-results',Boolean(term));document.querySelector('#total').textContent=term?`${hasMore?'Top ':''}${visible.length.toLocaleString()} matching faculty profiles`:`Castalia’s faculty directory`;more.textContent=term?'Load more matches':'Load more faculty';list.innerHTML=visible.map(x=>`<a class="person" href="profile.html?faculty=${encodeURIComponent(x.id)}"><span class="avatar">${esc(x.full.trim()[0]||'✳')}</span><span><span class="name">${esc(x.full)}</span><span class="count">${esc(x.rank||'Faculty profile')} · View profile →</span></span></a>`).join('');more.hidden=!hasMore;status.textContent=visible.length?'':'No faculty match that name.'}
async function loadRanked(reset=false){if(loading)return;loading=true;if(reset){offset=0;people=[];hasMore=true}status.textContent='Loading ranked faculty…';try{const {data,error}=await db.from('faculty').select('id,name,surname,rank').order('rank',{ascending:false,nullsFirst:false}).order('id').range(offset,offset+59);if(error)throw error;people.push(...(data||[]).map(x=>({id:x.id,full:window.castaliaFacultyName(x),rank:x.rank})));offset+=data?.length||0;hasMore=(data||[]).length===60;draw()}catch(e){status.textContent='Faculty directory is temporarily unavailable.';console.error('Faculty directory could not load',e.message)}finally{loading=false}}
async function searchFaculty(term,append=false){const version=++searchVersion;if(!term){await loadRanked(true);return}if(!append){searchOffset=0;people=[];hasMore=false}status.textContent='Searching faculty…';try{const pattern=`%${term.replace(/[%,()]/g,' ').trim()}%`,from=searchOffset,to=from+99;const [a,b]=await Promise.all([db.from('faculty').select('id,name,surname,rank').ilike('name',pattern).order('rank',{ascending:false,nullsFirst:false}).range(from,to),db.from('faculty').select('id,name,surname,rank').ilike('surname',pattern).order('rank',{ascending:false,nullsFirst:false}).range(from,to)]);if(version!==searchVersion)return;if(a.error)throw a.error;if(b.error)throw b.error;const map=new Map(people.map(x=>[x.id,x]));for(const x of [...(a.data||[]),...(b.data||[])])map.set(x.id,{id:x.id,full:window.castaliaFacultyName(x),rank:x.rank});people=[...map.values()].sort((x,y)=>(y.rank||0)-(x.rank||0)||x.full.localeCompare(y.full));searchOffset+=100;hasMore=(a.data||[]).length===100||(b.data||[]).length===100;draw()}catch(e){if(version===searchVersion){status.textContent='Faculty search is temporarily unavailable.';console.error('Faculty search failed',e.message)}}}
search.addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>searchFaculty(search.value.trim()),220)});more.addEventListener('click',()=>search.value.trim()?searchFaculty(search.value.trim(),true):loadRanked());loadRanked(true);</script></body></html>
